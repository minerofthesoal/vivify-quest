name: Build Quest Mod

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version number (optional, defaults to mod.json version)'
        required: false
        default: ''
      use_qpackages:
        description: 'Use qpackages.com along with github.com for dependencies'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: QPM Action
      id: qpm
      uses: Fernthedev/qpm-action@v1
      with:
        workflow_token: ${{ secrets.GITHUB_TOKEN }}
        # By default, restore is false (github.com only via restore-deps.py).
        # If use_qpackages is enabled, let qpm restore dependencies from qpackages.com
        # in addition to github.com sources.
        restore: ${{ github.event.inputs.use_qpackages == 'true' }}
        cache: true
        resolve_ndk: true

    - name: Restore dependencies (github.com only, no qpackages.com)
      if: github.event.inputs.use_qpackages != 'true'
      run: python3 scripts/restore-deps.py

    - name: Restore dependencies (github.com + qpackages.com)
      if: github.event.inputs.use_qpackages == 'true'
      run: |
        # First restore from github.com using our manifest
        python3 scripts/restore-deps.py
        # Then let qpm restore any additional/missing packages from qpackages.com
        qpm restore

    - name: Build
      run: qpm s build

    - name: Create QMOD
      run: qpm s qmod

    - name: Read mod version
      id: mod_version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=$(python3 -c "import json; print(json.load(open('mod.json'))['version'])")
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Rename QMOD artifact
      run: |
        for f in ./*.qmod; do
          mv "$f" "./Vivify-v${{ steps.mod_version.outputs.version }}.qmod"
        done

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vivify-v${{ steps.mod_version.outputs.version }}
        path: ./*.qmod
        if-no-files-found: error

    - name: Publish Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Vivify ${{ steps.mod_version.outputs.version }}
        generate_release_notes: true
        body: |
          Personal Quest build of Vivify (merge of axo-lotl/Vivifhy-Quest,
          rbatteries1-design/Vivify-Quest-Port, and Lars27110/Vivify-Quest —
          see README for what was merged from each).

          Built automatically from tag `${{ github.ref_name }}`.
        files: ./*.qmod
