name: Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check mod.json / qpm.json are well-formed
      run: |
        python3 -c "import json; json.load(open('mod.json'))"
        python3 -c "import json; json.load(open('qpm.json'))"
        echo "mod.json and qpm.json are valid JSON"

    - name: Validate mod.json against the QMod schema
      shell: pwsh
      run: ./scripts/validate-modjson.ps1

    - name: Check mod.json / qpm.json versions match
      run: |
        MOD_VERSION=$(python3 -c "import json; print(json.load(open('mod.json'))['version'])")
        QPM_VERSION=$(python3 -c "import json; print(json.load(open('qpm.json'))['info']['version'])")
        echo "mod.json version: $MOD_VERSION"
        echo "qpm.json version: $QPM_VERSION"
        if [ "$MOD_VERSION" != "$QPM_VERSION" ]; then
          echo "::error::mod.json version ($MOD_VERSION) and qpm.json info.version ($QPM_VERSION) are out of sync"
          exit 1
        fi

  bundle-converter-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build the converter for the host, with sanitizers
      run: |
        g++ -std=c++20 -O1 -g -fsanitize=address,undefined \
            -I include -o /tmp/conv \
            tools/bundleconvert/main.cpp src/VivifyBundleConvert.cpp

    - name: Round-trip and structure tests
      working-directory: tools/bundleconvert
      env:
        VIVIFY_CONV: /tmp/conv
      run: python3 run_tests.py

    - name: Corruption fuzz pass
      working-directory: tools/bundleconvert
      env:
        VIVIFY_CONV: /tmp/conv
      run: python3 fuzz.py

  texture-decoder-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build the BC/DXT decoder for the host, with sanitizers
      run: |
        g++ -std=c++20 -O1 -g -fsanitize=address,undefined \
            -I include -o /tmp/texdec \
            tools/texturedecode/main.cpp src/VivifyTextureDecode.cpp

    - name: Decoder tests
      run: /tmp/texdec

  host-syntax-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install clang and libc++ headers
      run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 libc++-18-dev libc++abi-18-dev

    # Catches type, name-lookup and template errors in this project's own code
    # without needing the Android NDK, so a mistake like calling a Runtime member
    # from a free function is caught here rather than several CI rounds later.
    # See the header comment in the script for what it deliberately does not cover.
    - name: Syntax-check every source file
      run: CLANG=clang++-18 ./scripts/host-syntax-check.sh

  shader-scan-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build the SerializedFile shader scanner for the host, with sanitizers
      run: |
        g++ -std=c++20 -O1 -g -fsanitize=address,undefined \
            -I include -o /tmp/shaderscan \
            tools/shaderscan/main.cpp src/VivifySerializedFile.cpp

    - name: Shader scanner tests
      run: python3 tools/shaderscan/run_tests.py /tmp/shaderscan
